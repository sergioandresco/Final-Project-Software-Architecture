name: CI - Development

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  build-and-push:
    name: Build, Test & Push (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Microservicios_y_Docker/InventoryService.sln

      - name: Build
        run: dotnet build Microservicios_y_Docker/InventoryService.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Microservicios_y_Docker/InventoryService.sln --no-build --configuration Release --verbosity normal

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image (dev tag)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./Microservicios_y_Docker
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/inventory-service:dev-${{ github.sha }}

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: dev-${{ github.sha }}
          name: Dev Build ${{ github.sha }}
          prerelease: true
          body: |
            ## Dev build from branch `development`

            **Commit:** ${{ github.sha }}
            **Triggered by:** ${{ github.actor }}

            ### Docker image
            ```
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/inventory-service:dev-${{ github.sha }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
