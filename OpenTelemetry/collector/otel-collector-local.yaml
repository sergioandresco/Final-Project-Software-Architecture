# OTel Collector — entorno local (docker compose).
#   Trazas   -> Jaeger (OTLP/gRPC)
#   Métricas -> endpoint Prometheus :8889 (scrapeado por Prometheus)
#   Logs     -> Loki (OTLP/HTTP), consultables en Grafana Explore
# Imagen: otel/opentelemetry-collector-contrib:0.162.0

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Debe ir PRIMERO: rechaza datos (back-pressure) antes de que el Collector se quede sin memoria.
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  # Enriquecimiento común a las tres señales.
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert
      - key: cloud.provider
        value: none
        action: insert
      - key: collector.pipeline
        value: otel-lab-local
        action: insert

  # Debe ir ÚLTIMO: agrupa para reducir el número de exportaciones.
  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 2s

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 5000
    retry_on_failure:
      enabled: true

  prometheus:
    endpoint: 0.0.0.0:8889
    # Convierte los atributos de Resource (service.name, ...) en labels de Prometheus.
    # Deprecado en favor de resource_constant_labels, pero en 0.162.0 esa opción no
    # agrega los labels (probado): se mantiene esta hasta que se corrija.
    resource_to_telemetry_conversion:
      enabled: true
    metric_expiration: 10m

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  extensions: [health_check, zpages]
  telemetry:
    logs:
      level: info
    # Métricas internas del Collector (otelcol_*) para el panel de errores en Grafana.
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/loki]
