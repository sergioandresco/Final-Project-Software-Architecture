# OTel Collector — GCP (GKE). Se monta como ConfigMap desde el chart Helm:
#   helm upgrade --install otel-lab ../helm/otel-lab --set-file collector.config=../../collector/otel-collector-gcp.yaml
#
#   Trazas   -> Jaeger (in-cluster) + Cloud Trace
#   Métricas -> endpoint Prometheus :8889 (ServiceMonitor de kube-prometheus-stack)
#   Logs     -> Cloud Logging (con trace vinculado) + Loki (correlación en Grafana Explore)
#
# Autenticación con Google Cloud: Workload Identity (KSA otel-collector -> GSA otel-collector@<project>).
# Variable requerida: GCP_PROJECT_ID.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Detecta cloud.provider, cloud.region, k8s.cluster.name, etc. desde el metadata server de GCP.
  resource_detection:
    detectors: [env, gcp]
    timeout: 5s
    override: false

  resource:
    attributes:
      - key: deployment.environment
        value: gcp-gke
        action: upsert
      - key: collector.pipeline
        value: otel-lab-gcp
        action: insert

  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 2s

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger-collector:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 5000

  googlecloud:
    project: ${env:GCP_PROJECT_ID}
    log:
      default_log_name: otel-lab

  prometheus:
    endpoint: 0.0.0.0:8889
    # Convierte los atributos de Resource (service.name, ...) en labels de Prometheus.
    # Deprecado en favor de resource_constant_labels, pero en 0.162.0 esa opción no
    # agrega los labels (probado): se mantiene esta hasta que se corrija.
    resource_to_telemetry_conversion:
      enabled: true
    metric_expiration: 10m

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  extensions: [health_check, zpages]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource, batch]
      exporters: [otlp_grpc/jaeger, googlecloud]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource, batch]
      exporters: [googlecloud, otlp_http/loki]
