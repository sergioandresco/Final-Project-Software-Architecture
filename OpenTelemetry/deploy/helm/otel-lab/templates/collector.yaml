{{- if not .Values.collector.config }}
{{- fail "collector.config es obligatorio: usa --set-file collector.config=../../collector/otel-collector-gcp.yaml" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  {{- with .Values.collector.gcpServiceAccount }}
  annotations:
    # Workload Identity: la KSA actúa como la GSA (Cloud Logging + Cloud Trace).
    iam.gke.io/gcp-service-account: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    {{- .Values.collector.config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        checksum/config: {{ .Values.collector.config | sha256sum }}
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: {{ .Values.collector.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: GCP_PROJECT_ID
              value: {{ .Values.collector.gcpProjectId | quote }}
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics-app, containerPort: 8889 }
            - { name: metrics-self, containerPort: 8888 }
            - { name: health, containerPort: 13133 }
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: metrics-app, port: 8889, targetPort: metrics-app }
    - { name: metrics-self, port: 8888, targetPort: metrics-self }
