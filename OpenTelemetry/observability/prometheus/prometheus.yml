# Prometheus local: scrapea el endpoint Prometheus del OTel Collector.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Métricas de la aplicación (OTLP -> Collector -> exporter prometheus).
  - job_name: otel-collector-app
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # Telemetría interna del Collector (otelcol_*): CPU, memoria, spans rechazados/fallidos.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
